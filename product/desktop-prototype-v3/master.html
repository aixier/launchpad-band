<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>随手乐队 · 大师演出</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="master.css">
</head>
<body class="idle">
<div class="app" id="app">
  <div id="stage" class="stage"></div>
  <div class="grade" aria-hidden="true"></div>

  <header class="topbar mbar" id="topbar">
    <div class="brand"><b>随手乐队</b><span>大师演出</span></div>
    <div class="mood" id="mood" role="status" aria-live="off">
      <span id="lvlName">观众</span>
      <i class="meter" aria-hidden="true"><b id="lvlFill"></b></i>
    </div>
    <div class="actions">
      <button class="btn ghost" id="songBtn" type="button">声源</button>
      <button class="btn ghost" id="redBtn" type="button" aria-pressed="false">动效</button>
      <button class="btn ghost" id="perfBtn" type="button" aria-pressed="false">表演</button>
    </div>
  </header>

  <div class="lvl-title" id="lvlTitle" aria-live="polite"></div>

  <section class="hud" id="hud" aria-label="指挥台:Launchpad 镜像">
    <div class="hint" id="hint" role="status"><i class="sw" id="sw" aria-hidden="true"></i><span id="hintText"></span></div>
    <div class="pad" id="pad"></div>
    <div class="hud-foot"><span class="legend">Shift 抬高四行 · 空格 · G · H</span><span id="devline">灯盘:虚拟</span></div>
  </section>

  <div class="track" id="track" aria-hidden="true"><span id="sceneName"></span><span class="ticks" id="ticks"></span></div>
  <div class="credit" id="credit">片段:"Born Again" by radionarcotix and Decktonic · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · 已截取并重新编码</div>
  <div class="nogl" id="nogl" hidden></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="vendor/three.min.js"></script>
<script src="audio.js"></script>
<script src="pad.js"></script>
<script src="director.js"></script>
<script src="stage.js"></script>
<script src="show.js"></script>
<script src="assets/born-again-clip.js"></script>
<script src="master.js"></script>
</body>
</html>
